<!DOCTYPE html>
<html>
<head>
  <title>Basketball Analyst Agent</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:2rem;}
    textarea{width:100%;height:120px;}
    button{margin-top:.5rem;padding:.5rem 1rem;}
    pre{margin-top:1rem;background:#f4f4f4;padding:1rem;white-space:pre-wrap;}
  </style>
</head>
<body>
  <h2>🏀 Basketball Analyst Agent</h2>
  <textarea id="msg" placeholder="Ask about a game, player, or prediction..."></textarea><br>
  <button onclick="run()">Send</button>
  <pre id="out"></pre>

  <script>
    async function run() {
      const msg = document.getElementById('msg').value;
      const resp = await fetch('/api/run', {
        method: 'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message: msg})
      });
      const data = await resp.json();
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
